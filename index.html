<style>
:root{
  /* Tinta y encuadernación */
  --fondo:#101317;
  --fondo-2:#171B21;
  --superficie:#1C2128;
  --superficie-alta:#242B34;
  --linea:rgba(214,169,74,.16);
  --linea-suave:rgba(255,255,255,.07);
  --texto:#E8E4DB;
  --texto-2:#9AA1AB;
  --texto-3:#6B7280;
  --oro:#D6A94A;
  --oro-suave:rgba(214,169,74,.12);
  --salvia:#6FA890;

  --display:'Fraunces',Georgia,serif;
  --ui:'Archivo',system-ui,-apple-system,sans-serif;
  --lectura:'Literata',Georgia,serif;

  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);
  color:var(--texto);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.bloqueado{overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Cabecera ---------- */
.tope{
  position:sticky;top:0;z-index:40;
  background:rgba(16,19,23,.88);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--linea-suave);
  padding:calc(var(--safe-t) + 12px) 16px 12px;
}
.tope-fila{display:flex;align-items:center;gap:12px}
.marca{
  font-family:var(--display);
  font-weight:600;
  font-size:24px;
  letter-spacing:-.02em;
  line-height:1;
  display:flex;align-items:baseline;gap:7px;
  flex:1;min-width:0;
}
.marca .punto{width:7px;height:7px;border-radius:50%;background:var(--oro);flex:none;transform:translateY(-3px)}
.tope .lema{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--texto-3);font-weight:600;margin-top:3px;
}
.nav{display:flex;gap:4px;background:var(--superficie);padding:3px;border-radius:99px;flex:none}
.nav button{
  padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--texto-2);
  transition:.18s;
}
.nav button.on{background:var(--superficie-alta);color:var(--texto)}

.buscador{position:relative;margin-top:12px}
.buscador input{
  width:100%;padding:12px 44px 12px 42px;
  background:var(--superficie);border:1px solid var(--linea-suave);
  border-radius:11px;color:var(--texto);
}
.buscador input::placeholder{color:var(--texto-3)}
.buscador input:focus{border-color:var(--linea);outline:none}
.buscador .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--texto-3);pointer-events:none}
.buscador .limpiar{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;color:var(--texto-3);
  display:none;align-items:center;justify-content:center;
}
.buscador .limpiar.ver{display:flex}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;
  background:var(--superficie);color:var(--texto-2);border:1px solid transparent;
  white-space:nowrap;transition:.18s;
}
.chip.on{background:var(--oro-suave);color:var(--oro);border-color:var(--linea)}

/* ---------- Rejilla ---------- */
.envoltura{padding:20px 16px calc(48px + var(--safe-b));max-width:1180px;margin:0 auto}
.titulo-seccion{
  font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;
  margin:0 0 3px;
}
.sub-seccion{font-size:13.5px;color:var(--texto-3);margin:0 0 18px}

.rejilla{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:22px 14px;
}
@media(min-width:700px){.rejilla{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:28px 20px}}

.libro{text-align:left;width:100%;display:block}
.tapa{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;
  overflow:hidden;display:flex;flex-direction:column;
  padding:16px 14px 14px 20px;
  box-shadow:0 10px 22px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06) inset;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s;
}
.libro:active .tapa{transform:translateY(-3px) scale(.985)}
@media(hover:hover){.libro:hover .tapa{transform:translateY(-5px);box-shadow:0 18px 34px rgba(0,0,0,.5)}}
/* lomo */
.tapa::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:9px;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.08) 60%,rgba(255,255,255,.07));
}
/* textura de tela */
.tapa::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 78% 8%,rgba(255,255,255,.12),transparent 62%);
}
.marco{
  position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
  border:1px solid rgba(255,255,255,.24);border-radius:2px;padding:12px 10px;
}
.tapa-titulo{
  font-family:var(--display);font-weight:600;font-size:14px;line-height:1.24;
  letter-spacing:-.005em;color:rgba(255,248,232,.97);
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.tapa-regla{height:1px;background:rgba(255,255,255,.28);margin:10px 0 8px;flex:none}
.tapa-autor{
  margin-top:auto;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;
  color:rgba(255,248,232,.74);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.insignia{
  position:absolute;top:9px;right:9px;z-index:2;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.2);
  border-radius:99px;padding:3px 8px;font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;
}
.pie{margin-top:9px}
.pie b{display:block;font-size:13px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pie span{display:block;font-size:11.5px;color:var(--texto-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrita{height:3px;background:var(--superficie-alta);border-radius:99px;margin-top:7px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--oro);border-radius:99px}

/* ---------- Estados ---------- */
.aviso{text-align:center;padding:64px 22px;color:var(--texto-3)}
.aviso h3{font-family:var(--display);font-size:19px;color:var(--texto-2);margin:0 0 8px;font-weight:600}
.aviso p{margin:0;font-size:14px;line-height:1.6;max-width:340px;margin-inline:auto}
.aviso button{margin-top:18px;padding:11px 22px;border-radius:99px;background:var(--oro);color:#1A1408;font-weight:700;font-size:14px}
.esqueleto{width:100%;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;background:var(--superficie);
  animation:latir 1.4s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:.5}50%{opacity:.85}}
.mas{display:block;margin:34px auto 0;padding:13px 30px;border-radius:99px;
  border:1px solid var(--linea);color:var(--oro);font-weight:600;font-size:14px;background:var(--oro-suave)}

/* ---------- Ficha ---------- */
.telon{
  position:fixed;inset:0;z-index:60;background:rgba(8,10,13,.78);
  backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;
}
.telon.ver{display:flex}
.ficha{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--fondo-2);border-radius:22px 22px 0 0;
  border-top:1px solid var(--linea);
  padding:10px 20px calc(24px + var(--safe-b));
  animation:subir .26s cubic-bezier(.2,.8,.3,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes subir{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.agarre{width:38px;height:4px;border-radius:99px;background:var(--superficie-alta);margin:0 auto 18px}
.ficha-tope{display:flex;gap:16px;margin-bottom:18px}
.ficha-tapa{width:104px;flex:none}
.ficha-info h2{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.22;margin:0 0 6px;letter-spacing:-.01em}
.ficha-info .autor{font-size:14px;color:var(--oro);margin:0 0 10px;font-weight:500}
.metas{display:flex;flex-wrap:wrap;gap:6px}
.meta{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--superficie);color:var(--texto-2);font-weight:500}
.temas{font-size:12.5px;color:var(--texto-3);line-height:1.6;margin:0 0 18px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

<script>
"use strict";

/* ============================================================
   1. ALMACENAMIENTO
   localStorage para metadatos y progreso.
   IndexedDB para el texto completo de los libros (offline).
   Si algo falla, cae a memoria para que la app nunca se rompa.
   ============================================================ */
const Guardado = (() => {
  let disponible = true;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ disponible = false; }
  const memoria = {};
  return {
    leer(clave, porDefecto){
      try{
        const v = disponible ? localStorage.getItem(clave) : memoria[clave];
        return v ? JSON.parse(v) : porDefecto;
      }catch(e){ return porDefecto; }
    },
    escribir(clave, valor){
      try{
        const v = JSON.stringify(valor);
        if(disponible) localStorage.setItem(clave, v); else memoria[clave] = v;
      }catch(e){ memoria[clave] = JSON.stringify(valor); }
    }
  };
})();

const Textos = (() => {
  const NOMBRE = 'anaquel', TIENDA = 'textos';
  const cacheMemoria = new Map();
  let bd = null, intentado = false;

  function abrir(){
    if(bd) return Promise.resolve(bd);
    if(intentado && !bd) return Promise.resolve(null);
    intentado = true;
    return new Promise(res => {
      try{
        if(!window.indexedDB) return res(null);
        const p = indexedDB.open(NOMBRE, 1);
        p.onupgradeneeded = () => {
          const d = p.result;
          if(!d.objectStoreNames.contains(TIENDA)) d.createObjectStore(TIENDA);
        };
        p.onsuccess = () => { bd = p.result; res(bd); };
        p.onerror = () => res(null);
        setTimeout(() => res(bd), 2500);
      }catch(e){ res(null); }
    });
  }

  return {
    async obtener(id){
      if(cacheMemoria.has(id)) return cacheMemoria.get(id);
      const d = await abrir();
      if(!d) return null;
      return new Promise(res => {
        try{
          const t = d.transaction(TIENDA,'readonly').objectStore(TIENDA).get(String(id));
          t.onsuccess = () => res(t.result || null);
          t.onerror = () => res(null);
        }catch(e){ res(null); }
      });
    },
    async poner(id, texto){
      cacheMemoria.set(id, texto);
      const d = await abrir();
      if(!d) return;
      try{ d.transaction(TIENDA,'readwrite').objectStore(TIENDA).put(texto, String(id)); }catch(e){}
    },
    async borrar(id){
      cacheMemoria.delete(id);
      const d = await abrir();
      if(!d) return;
      try{ d.transaction(TIENDA,'readwrite').objectStore(TIENDA).delete(String(id)); }catch(e){}
    }
  };
})();

/* ============================================================
   2. ESTADO
   ============================================================ */
const estado = {
  vista: 'explorar',
  idioma: 'es',
  tema: '',
  busqueda: '',
  pagina: 1,
  siguiente: null,
  cargando: false,
  libros: [],
  biblioteca: Guardado.leer('anaquel:biblioteca', {}),   // id -> {id,titulo,autor,idioma,tema,añadido}
  progreso: Guardado.leer('anaquel:progreso', {}),       // id -> {pct, y, visto}
  ajustes: Guardado.leer('anaquel:ajustes', {tam:18, alto:1.75, fuente:'serif', tema:'papel'}),
  marcas: Guardado.leer('anaquel:marcas', {}),          // id -> [{pct, texto, t}]
  actual: null,
  indice: [],
  pestaña: 'indice'
};

function guardarMarcas(){ Guardado.escribir('anaquel:marcas', estado.marcas); }

const TEMAS = [
  {id:'',        eti:'Todo'},
  {id:'fiction', eti:'Novela'},
  {id:'poetry',  eti:'Poesía'},
  {id:'history', eti:'Historia'},
  {id:'adventure', eti:'Aventura'},
  {id:'detective', eti:'Misterio'},
  {id:'horror',  eti:'Terror'},
  {id:'love',    eti:'Romance'},
  {id:'philosophy', eti:'Filosofía'},
  {id:'drama',   eti:'Teatro'},
  {id:'children', eti:'Infantil'},
  {id:'science', eti:'Ciencia'}
];

/* Telas de encuadernación — el color sale del título, así cada libro
   tiene siempre la misma tapa. */
const TELAS = [
  ['#2F5D50','#22463C'], ['#6E2C2C','#521F1F'], ['#2A3F5F','#1E2E46'],
  ['#7A5C15','#5C4510'], ['#4A2E4D','#37213A'], ['#5A4632','#423325'],
  ['#34495E','#26374A'], ['#7A3B24','#5B2B1A'], ['#1F5A5A','#154242'],
  ['#5D3A5E','#452B46']
];
function tela(txt){
  let h = 0;
  for(let i=0;i<txt.length;i++) h = (h*31 + txt.charCodeAt(i)) >>> 0;
  return TELAS[h % TELAS.length];
}

/* ============================================================
   3. UTILIDADES
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function autorDe(libro){
  if(!libro.authors || !libro.authors.length) return 'Anónimo';
  const n = libro.authors[0].name || '';
  const p = n.split(',');
  return (p.length > 1 ? p[1].trim() + ' ' + p[0].trim() : n).trim() || 'Anónimo';
}

let relojBrindis;
function brindis(msg){
  const b = $('#brindis');
  b.textContent = msg;
  b.classList.add('ver');
  clearTimeout(relojBrindis);
  relojBrindis = setTimeout(() => b.classList.remove('ver'), 2600);
}

function guardarBiblioteca(){ Guardado.escribir('anaquel:biblioteca', estado.biblioteca); }
function guardarProgreso(){ Guardado.escribir('anaquel:progreso', estado.progreso); }

/* ============================================================
   4. CATÁLOGO (Gutendex → Project Gutenberg)
   ============================================================ */
const API = 'https://gutendex.com/books';

function urlCatalogo(){
  const p = new URLSearchParams();
  if(estado.idioma) p.set('languages', estado.idioma);
  if(estado.busqueda) p.set('search', estado.busqueda);
  if(estado.tema) p.set('topic', estado.tema);
  p.set('sort', estado.busqueda ? 'popular' : 'popular');
  p.set('page', estado.pagina);
  return API + '?' + p.toString();
}

/* Gutendex es un servidor comunitario y se cae con frecuencia.
   Por eso: varias rutas de respaldo + caché local de 7 días. */
function rutasJSON(url){
  const u = url.replace(/^http:/, 'https:');
  return [
    u,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    'https://corsproxy.io/?url=' + encodeURIComponent(u),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
  ];
}

async function traerJSON(url){
  let ultimo = null;
  for(const r of rutasJSON(url)){
    try{
      const ctrl = new AbortController();
      const reloj = setTimeout(() => ctrl.abort(), 14000);
      const resp = await fetch(r, {signal: ctrl.signal});
      clearTimeout(reloj);
      if(!resp.ok){ ultimo = 'http ' + resp.status; continue; }
      const d = JSON.parse(await resp.text());
      if(d && Array.isArray(d.results)) return d;
      ultimo = 'formato inesperado';
    }catch(e){ ultimo = e.name || 'error'; }
  }
  throw new Error(ultimo || 'sin ruta');
}

const SIETE_DIAS = 7 * 24 * 60 * 60 * 1000;

function guardarEnCache(url, d){
  try{
    const c = Guardado.leer('anaquel:cache', {});
    const claves = Object.keys(c);
    if(claves.length > 24) delete c[claves[0]];
    c[url] = {t: Date.now(), d};
    Guardado.escribir('anaquel:cache', c);
  }catch(e){}
}

function leerDeCache(url){
  const c = Guardado.leer('anaquel:cache', {});
  const e = c[url];
  return (e && Date.now() - e.t < SIETE_DIAS) ? e.d : null;
}

async function traerCatalogo(reiniciar){
  if(estado.cargando) return;
  estado.cargando = true;

  if(reiniciar){
    estado.pagina = 1;
    estado.libros = [];
    pintarEsqueletos();
  }
  $('#zonaAviso').innerHTML = '';
  const url = urlCatalogo();

  try{
    const d = await traerJSON(url);
    guardarEnCache(url, d);
    estado.libros = estado.libros.concat(d.results || []);
    estado.siguiente = d.next || null;
    pintarCatalogo(d.count || 0);
  }catch(e){
    const guardado = leerDeCache(url);
    if(guardado){
      estado.libros = estado.libros.concat(guardado.results || []);
      estado.siguiente = guardado.next || null;
      pintarCatalogo(guardado.count || 0);
      brindis('Mostrando la última versión guardada');
    }else if(!estado.libros.length){
      $('#rejilla').innerHTML = '';
      $('#subSeccion').textContent = '';
      avisar('El catálogo no responde',
        'El servidor de Project Gutenberg está caído o sin conexión. Suele volver en unos minutos.',
        'Reintentar', () => traerCatalogo(true));
    }else{
      brindis('No se pudieron cargar más libros');
    }
  }finally{
    estado.cargando = false;
  }
}

  el.innerHTML = `
    <div class="tapa" style="background:linear-gradient(140deg,${c1},${c2})">

function pintarBiblioteca(){
  const items = Object.values(estado.biblioteca).sort((a,b) => {
    const pa = estado.progreso[a.id]?.visto || a.añadido || 0;
    const pb = estado.progreso[b.id]?.visto || b.añadido || 0;
    return pb - pa;
  });

  $('#tituloSeccion').textContent = 'Mis libros';
  $('#zonaAviso').innerHTML = '';

  if(!items.length){
    $('#rejilla').innerHTML = '';
    $('#subSeccion').textContent = '';
    avisar('Tu anaquel está vacío',
      'Guarda un libro y aparecerá aquí, con tu progreso de lectura al día.',
      'Explorar el catálogo', () => cambiarVista('explorar'));
    return;
  }

  const leyendo = items.filter(i => (estado.progreso[i.id]?.pct || 0) > 1).length;
  $('#subSeccion').textContent = leyendo
    ? `${items.length} guardados · ${leyendo} en curso`
    : `${items.length} ${items.length === 1 ? 'libro guardado' : 'libros guardados'}`;

  const r = $('#rejilla');
  r.innerHTML = items.map(i => tarjeta({id:i.id, title:i.titulo, authors:[{name:i.autor}]}, {mostrarProgreso:true})).join('');
  r.querySelectorAll('.libro').forEach(b => b.onclick = () => abrirFicha(+b.dataset.id));
}

  $('#chips').innerHTML = TEMAS.map(t =>
    `<button class="chip ${estado.tema === t.id ? 'on' : ''}" data-t="${t.id}">${t.eti}</button>`

/* ============================================================
   7. DESCARGA DEL TEXTO
   Gutenberg no siempre permite descarga directa desde el navegador,
   así que probamos varias rutas hasta que una responda.
   ============================================================ */
function urlTexto(libro){
  const f = libro.formats || {};
  return f['text/plain; charset=utf-8'] || f['text/plain'] ||
         f['text/plain; charset=us-ascii'] || f['text/plain; charset=iso-8859-1'] ||
         `https://www.gutenberg.org/cache/epub/${libro.id}/pg${libro.id}.txt`;
}

function rutas(url){
  const u = url.replace(/^http:/, 'https:');
  return [
    u,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    'https://corsproxy.io/?url=' + encodeURIComponent(u),
    'https://r.jina.ai/' + u
  ];
}

async function bajarTexto(libro){
  const base = urlTexto(libro);
  let ultimo = null;
  for(const r of rutas(base)){
    try{
      const ctrl = new AbortController();
      const reloj = setTimeout(() => ctrl.abort(), 22000);
      const resp = await fetch(r, {signal: ctrl.signal});
      clearTimeout(reloj);
      if(!resp.ok) { ultimo = 'http ' + resp.status; continue; }
      const t = await resp.text();
      if(t && t.length > 2000) return t;
      ultimo = 'respuesta corta';
    }catch(e){ ultimo = e.name; }
  }
  throw new Error(ultimo || 'sin ruta');
}

function limpiar(bruto){
  let t = bruto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  const ini = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG EBOOK[\s\S]*?\*\*\*/i);
  if(ini !== -1){
    const m = t.slice(ini).match(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG EBOOK[\s\S]*?\*\*\*/i);
    t = t.slice(ini + m[0].length);
  }
  const fin = t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG EBOOK/i);
  if(fin !== -1) t = t.slice(0, fin);

  // Quitar la nota de transcripción inicial si existe
  t = t.replace(/^\s*(Produced by|Transcri(bed|ptor)|E-text prepared by)[\s\S]{0,600}?\n\n/i, '\n');

  const bloques = t.split(/\n[ \t]*\n+/);
  const parrafos = [];
  for(let b of bloques){
    b = b.trim();
    if(!b) continue;
    const lineas = b.split('\n').map(l => l.trim());
    // Verso: varias líneas cortas seguidas → conservar los saltos
    const corto = lineas.length > 1 && lineas.every(l => l.length < 62);
    parrafos.push({
      texto: corto ? lineas.join('\n') : lineas.join(' '),
      verso: corto
    });
  }
  return parrafos;
}

const RE_CAP = /^(cap[íi]tulo|cap\.|chapter|parte|libro|acto|escena|tomo|secci[óo]n|prefacio|pr[óo]logo|ep[íi]logo|introducci[óo]n|[IVXLCDM]{1,7})\b[\s.\-–—:]*.{0,72}$/i;

function esCapitulo(p){
  if(p.verso) return false;
  const t = p.texto.trim();
  if(t.length > 80 || t.length < 2) return false;
  if(/[.;:!?,]$/.test(t) && !/^cap/i.test(t)) return false;
  return RE_CAP.test(t) || (t === t.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(t) && t.length < 60);
}

   8. LECTOR
   ============================================================ */
let guardarProgresoDiferido, ocultarControles, controlesVisibles = true;

function aplicarAjustes(){
  const a = estado.ajustes;
  const l = $('#lector');
  l.style.setProperty('--l-tam', a.tam + 'px');
  l.style.setProperty('--l-alto', a.alto);
  l.dataset.fuente = a.fuente;
  l.dataset.tema = a.tema;
  document.querySelectorAll('.aj-ops').forEach(g => {
    const clave = g.dataset.grupo;
    g.querySelectorAll('.aj-op').forEach(b =>
      b.classList.toggle('on', String(a[clave]) === b.dataset.v));
  });
  Guardado.escribir('anaquel:ajustes', a);
}

async function abrirLector(libro){
  estado.actual = libro;
  $('#lTitulo').textContent = libro.title || '';
  $('#lTexto').innerHTML = '';
  $('#lBarra').style.width = '0';
  $('#lPorcentaje').textContent = '0 %';
  $('#lRestante').textContent = '';
  $('#lector').classList.add('ver');
  document.body.classList.add('bloqueado');
  aplicarAjustes();
  mostrarControles();

  const carga = document.createElement('div');
  carga.className = 'cargando-lector';
  carga.innerHTML = '<div><div class="giro"></div><p>Abriendo el libro…</p></div>';
  $('#lector').appendChild(carga);

  try{
    let bruto = await Textos.obtener(libro.id);
    if(!bruto){
      carga.querySelector('p').textContent = 'Descargando el libro. La primera vez puede tardar un poco.';
      bruto = await bajarTexto(libro);
      Textos.poner(libro.id, bruto);
    }

    const parrafos = limpiar(bruto);
    if(!parrafos.length) throw new Error('vacío');

    estado.indice = [];
    let n = 0;
    $('#lTexto').innerHTML = parrafos.map(p => {
      const cuerpo = esc(p.texto).replace(/\n/g, '<br>');
      if(esCapitulo(p)){
        const id = 'cap' + (n++);
        estado.indice.push({id, texto: p.texto.trim()});
        return `<p class="cap" id="${id}">${cuerpo}</p>`;
      }
      return `<p${p.verso ? ' style="text-align:left"' : ''}>${cuerpo}</p>`;
    }).join('') + '<div class="l-fin">Fin</div>';

    carga.remove();
    pintarPanel();

    // Restaurar posición
    const pr = estado.progreso[libro.id];
    const c = $('#lCuerpo');
    requestAnimationFrame(() => {
      if(pr && pr.pct > 0.5){
        c.scrollTop = (pr.pct / 100) * (c.scrollHeight - c.clientHeight);
        brindis(`Retomamos en el ${Math.round(pr.pct)} %`);
      }
      actualizarProgreso();
      refrescarIconoMarca();
    });

    // Guardar en la biblioteca automáticamente al empezar a leer
    if(!estado.biblioteca[libro.id]){
      estado.biblioteca[libro.id] = {
        id: libro.id, titulo: libro.title, autor: autorDe(libro),
        idioma: (libro.languages || [])[0] || '', formatos: libro.formats || {},
        añadido: Date.now()
      };
      guardarBiblioteca();
    }
  }catch(e){
    carga.innerHTML = `<div>
      <p style="font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 6px">No se pudo abrir el libro</p>
      <p>El servidor de Project Gutenberg no respondió. Suele funcionar al segundo intento.</p>
      <button id="btnReintentar">Intentar de nuevo</button>
      <button id="btnVolver" style="margin-left:8px">Volver</button>
    </div>`;
    carga.querySelector('#btnReintentar').onclick = () => { carga.remove(); abrirLector(libro); };
    carga.querySelector('#btnVolver').onclick = cerrarLector;
  }
}

function cerrarLector(){
  actualizarProgreso();
  $('#lector').classList.remove('ver');
  $('#ajustes').classList.remove('ver');
  $('#panel').classList.remove('ver');
  $('#panelFondo').classList.remove('ver');
  estado.indice = [];
  document.body.classList.remove('bloqueado');
  const c = $('#lector').querySelector('.cargando-lector');
  if(c) c.remove();
  estado.actual = null;
  if(estado.vista === 'biblioteca') pintarBiblioteca();
  else pintarCatalogo(estado.libros.length);
}

function actualizarProgreso(){
  if(!estado.actual) return;
  const c = $('#lCuerpo');
  const max = c.scrollHeight - c.clientHeight;
  const pct = max > 0 ? Math.min(100, (c.scrollTop / max) * 100) : 0;

  $('#lBarra').style.width = pct + '%';
  $('#lPorcentaje').textContent = Math.round(pct) + ' %';

  // Estimación: ~230 palabras por minuto sobre el texto restante
  const palabras = ($('#lTexto').textContent.match(/\S+/g) || []).length;
  const min = Math.round((palabras * (1 - pct/100)) / 230);
  $('#lRestante').textContent = pct >= 99 ? 'Terminado'
    : min > 60 ? `${Math.floor(min/60)} h ${min%60} min restantes`
    : `${Math.max(1,min)} min restantes`;

  estado.progreso[estado.actual.id] = {pct, visto: Date.now()};
  clearTimeout(guardarProgresoDiferido);
  guardarProgresoDiferido = setTimeout(guardarProgreso, 700);
}

function pintarIndice(lista){
  if(!estado.indice.length){
    lista.innerHTML = `<div class="panel-vacio">Este libro no trae capítulos marcados en el texto original.<br><br>Usa los marcadores para volver a donde quieras.</div>`;
    return;
  }
  const c = $('#lCuerpo');
  const actual = c.scrollTop + c.clientHeight * 0.3;
  let aqui = 0;
  estado.indice.forEach((it, i) => {
    const el = document.getElementById(it.id);
    if(el && el.offsetTop <= actual) aqui = i;
  });

  lista.innerHTML = estado.indice.map((it, i) =>
    `<button class="panel-item ${i === aqui ? 'aqui' : ''}" data-ir="${it.id}">${esc(it.texto)}</button>`
  ).join('');

  lista.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.ir);
    if(!el) return;
    cerrarPanel();
    $('#lCuerpo').scrollTo({top: el.offsetTop - 70, behavior:'smooth'});
  });

  const act = lista.querySelector('.aqui');
  if(act) act.scrollIntoView({block:'center'});
}

function pintarMarcas(lista){
  const id = estado.actual?.id;
  const ms = (estado.marcas[id] || []).slice().sort((a,b) => a.pct - b.pct);

  if(!ms.length){
    lista.innerHTML = `<div class="panel-vacio">Todavía no has puesto marcadores.<br><br>Toca el marcapáginas de arriba mientras lees para guardar el punto exacto.</div>`;
    return;
  }

  lista.innerHTML = ms.map((m, i) => `
    <div class="panel-item panel-marca">
      <span data-ir="${m.pct}"><b>${esc(m.texto)}</b><small>${Math.round(m.pct)} %</small></span>
      <button class="quitar-marca" data-quitar="${i}" aria-label="Quitar marcador">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>`).join('');

  lista.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    const c = $('#lCuerpo');
    cerrarPanel();
    c.scrollTo({top: (+b.dataset.ir / 100) * (c.scrollHeight - c.clientHeight), behavior:'smooth'});
  });

  lista.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    const orig = estado.marcas[id];
    const obj = ms[+b.dataset.quitar];
    estado.marcas[id] = orig.filter(x => x !== obj);
    if(!estado.marcas[id].length) delete estado.marcas[id];
    guardarMarcas();
    pintarPanel();
    refrescarIconoMarca();
    brindis('Marcador eliminado');
  });
}

/* Texto de referencia: el párrafo visible en el centro de la pantalla */
function textoVisible(){
  const c = $('#lCuerpo');
  const centro = c.scrollTop + c.clientHeight / 2;
  const ps = $('#lTexto').querySelectorAll('p');
  for(const p of ps){
    if(p.offsetTop + p.offsetHeight >= centro){
      const t = p.textContent.trim();
      return t.length > 90 ? t.slice(0, 90).trim() + '…' : (t || 'Marcador');
    }
  }
  return 'Marcador';
}

function marcaCercana(){
  const id = estado.actual?.id;
  const pct = estado.progreso[id]?.pct ?? 0;
  return (estado.marcas[id] || []).find(m => Math.abs(m.pct - pct) < 1.2);
}

function refrescarIconoMarca(){
  $('#iconoMarca').setAttribute('fill', marcaCercana() ? 'currentColor' : 'none');
}

function alternarMarca(){
  if(!estado.actual) return;
  const id = estado.actual.id;
  const existente = marcaCercana();

  if(existente){
    estado.marcas[id] = estado.marcas[id].filter(m => m !== existente);
    if(!estado.marcas[id].length) delete estado.marcas[id];
    brindis('Marcador quitado');
  }else{
    const c = $('#lCuerpo');
    const max = c.scrollHeight - c.clientHeight;
    const pct = max > 0 ? (c.scrollTop / max) * 100 : 0;
    (estado.marcas[id] = estado.marcas[id] || []).push({pct, texto: textoVisible(), t: Date.now()});
    brindis(`Marcador guardado en el ${Math.round(pct)} %`);
  }
  guardarMarcas();
  refrescarIconoMarca();
  if($('#panel').classList.contains('ver')) pintarPanel();
}

function mostrarControles(){
  controlesVisibles = true;
  $('#lTope').classList.remove('oculto');
  $('#lPie').classList.remove('oculto');
  clearTimeout(ocultarControles);
  ocultarControles = setTimeout(() => {
    if($('#ajustes').classList.contains('ver')) return;
    controlesVisibles = false;
    $('#lTope').classList.add('oculto');
    $('#lPie').classList.add('oculto');
  }, 3200);
}

/* ============================================================
   9. EVENTOS
   ============================================================ */
$('#navExplorar').onclick = () => cambiarVista('explorar');
$('#navBiblioteca').onclick = () => cambiarVista('biblioteca');

let relojBuscar;
$('#buscar').oninput = e => {
  const v = e.target.value.trim();
  $('#limpiar').classList.toggle('ver', !!v);
  clearTimeout(relojBuscar);
  relojBuscar = setTimeout(() => {
    if(v === estado.busqueda) return;
    estado.busqueda = v;
    traerCatalogo(true);
  }, 420);
};
$('#buscar').onkeydown = e => { if(e.key === 'Enter') e.target.blur(); };
$('#limpiar').onclick = () => {
  $('#buscar').value = '';
  $('#limpiar').classList.remove('ver');
  estado.busqueda = '';
  traerCatalogo(true);
};

$('#telon').onclick = e => { if(e.target === $('#telon')) cerrarFicha(); };
$('#cerrarLector').onclick = cerrarLector;

$('#abrirPanel').onclick = abrirPanel;
$('#panelFondo').onclick = cerrarPanel;
$('#ponerMarca').onclick = alternarMarca;

document.querySelectorAll('.panel-tab').forEach(t => t.onclick = () => {
  estado.pestaña = t.dataset.p;
  document.querySelectorAll('.panel-tab').forEach(o => o.classList.toggle('on', o === t));
  pintarPanel();
});

$('#abrirAjustes').onclick = () => {
  const a = $('#ajustes');
  a.classList.toggle('ver');
  if(a.classList.contains('ver')){ clearTimeout(ocultarControles); }
  else mostrarControles();
};

document.querySelectorAll('.aj-ops').forEach(g => {
  g.querySelectorAll('.aj-op').forEach(b => b.onclick = () => {
    const clave = g.dataset.grupo;
    const v = b.dataset.v;
    estado.ajustes[clave] = (clave === 'tam') ? +v : (clave === 'alto') ? +v : v;
    aplicarAjustes();
    requestAnimationFrame(actualizarProgreso);
  });
});

let relojMarca;
$('#lCuerpo').addEventListener('scroll', () => {
  actualizarProgreso();
  if(controlesVisibles) mostrarControles();
  clearTimeout(relojMarca);
  relojMarca = setTimeout(refrescarIconoMarca, 200);
}, {passive:true});

$('#lCuerpo').addEventListener('click', e => {
  if($('#ajustes').classList.contains('ver')){
    $('#ajustes').classList.remove('ver');
    mostrarControles();
    return;
  }
  if(controlesVisibles){
    controlesVisibles = false;
    clearTimeout(ocultarControles);
    $('#lTope').classList.add('oculto');
    $('#lPie').classList.add('oculto');
  }else mostrarControles();
});

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#panel').classList.contains('ver')) cerrarPanel();
  else if($('#lector').classList.contains('ver')) cerrarLector();
  else if($('#telon').classList.contains('ver')) cerrarFicha();
});

/* Instalable en la pantalla de inicio sin archivos extra */
try{
  const manifiesto = {
    name:'Anaquel', short_name:'Anaquel',
    description:'Miles de libros completos, gratis y legales.',
    start_url:'./', display:'standalone', orientation:'portrait',
    background_color:'#101317', theme_color:'#101317', lang:'es',
    icons:[{src: document.querySelector('link[rel="apple-touch-icon"]').href,
            sizes:'180x180', type:'image/png', purpose:'any'}]
  };
  const enlace = document.createElement('link');
  enlace.rel = 'manifest';
  enlace.href = URL.createObjectURL(new Blob([JSON.stringify(manifiesto)], {type:'application/json'}));
  document.head.appendChild(enlace);
}catch(e){}

window.addEventListener('beforeunload', () => { if(estado.actual) guardarProgreso(); });
document.addEventListener('visibilitychange', () => { if(document.hidden) guardarProgreso(); });

/* ============================================================
   10. ARRANQUE
   ============================================================ */
aplicarAjustes();
pintarChips();
traerCatalogo(true);
</script>
